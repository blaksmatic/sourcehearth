name: Validate and deploy SourceHearth
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate:games
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm run prepare:deploy
        env:
          SOURCE_REVISION: ${{ github.sha }}
      - name: Validate Worker configuration
        run: npx wrangler deploy --config dist/server/wrangler.production.json --dry-run
      - name: Verify migrations on a fresh local database
        run: npx wrangler d1 migrations apply DB --local --config dist/server/wrangler.production.json --persist-to .wrangler/ci-state
      - name: Save the tested build
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: |
            dist/
            !dist/**/.wrangler/**
          include-hidden-files: true
          retention-days: 7
  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: sourcehearth-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://sourcehearth.com
    steps:
      - uses: actions/checkout@v4
      - name: Skip superseded commits
        id: current
        shell: bash
        run: |
          latest=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'This commit has been superseded; skipping deployment.'
          fi
      - name: Check deployment credential
        if: steps.current.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo '::error::Add the CLOUDFLARE_API_TOKEN repository secret. See DEPLOYMENT.md.'
            exit 1
          fi
      - uses: actions/setup-node@v4
        if: steps.current.outputs.deploy == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.current.outputs.deploy == 'true'
      - uses: actions/download-artifact@v4
        if: steps.current.outputs.deploy == 'true'
        with:
          name: production-build
          path: dist/
      - name: Apply production database migrations
        if: steps.current.outputs.deploy == 'true'
        run: npx wrangler d1 migrations apply DB --remote --config dist/server/wrangler.production.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy the tested Worker and assets
        if: steps.current.outputs.deploy == 'true'
        run: npx wrangler deploy --config dist/server/wrangler.production.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify live site and database
        if: steps.current.outputs.deploy == 'true'
        run: npm run deploy:check
        env:
          SOURCE_REVISION: ${{ github.sha }}
          SITE_URL: https://sourcehearth.com
